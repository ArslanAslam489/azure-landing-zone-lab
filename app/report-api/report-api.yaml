apiVersion: apps/v1
kind: Deployment
metadata:
  name: report-api
spec:
  replicas: 1
  selector:
    matchLabels: {app: report-api}
  template:
    metadata:
      labels: {app: report-api}
    spec:
      containers:
      - name: api
        image: <ACR>.azurecr.io/report-api:v2
        ports:
        - containerPort: 8080
        envFrom:
        - secretRef: {name: sql-conn}
        env:
        - {name: REGION, value: swedencentral}   # shown on the page; northeurope in the DR copy
        readinessProbe:
          httpGet: {path: /healthz, port: 8080}
        livenessProbe:
          httpGet: {path: /healthz, port: 8080}
        resources:
          requests: {cpu: 50m, memory: 128Mi}
          limits: {memory: 256Mi}
---
apiVersion: v1
kind: Service
metadata:
  name: report-api
spec:
  selector: {app: report-api}
  ports:
  - port: 80
    targetPort: 8080
